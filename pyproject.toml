[project]
name = "django-helm"
version = "0.2.0"
description = "Django integration for Helm — logging, attribution, and more"
requires-python = ">=3.10"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "requests", "django>=5.0,<6.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
